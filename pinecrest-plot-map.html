    's3-r7-c0': { status: 'sold', name: 'Charles Johnson', section: 4, row: 'H', col: 1 },
    's3-r7-c1': { status: 'buried', name: 'Frances Johnson', section: 4, row: 'H', col: 2 },
    's3-r8-c0': { status: 'sold', name: 'George Johnson', section: 4, row: 'I', col: 1 },
    's3-r8-c1': { status: 'sold', name: 'Ruth Johnson', section: 4, row: 'I', col: 2 },
    's3-r9-c0': { status: 'buried', name: 'Thomas Johnson', section: 4, row: 'J', col: 1 },
    's3-r9-c1': { status: 'sold', name: 'Alice Johnson', section: 4, row: 'J', col: 2 },
    's3-r10-c0': { status: 'sold', name: 'Henry Johnson', section: 4, row: 'K', col: 1 },
    's3-r10-c1': { status: 'buried', name: 'Mildred Johnson', section: 4, row: 'K', col: 2 },
    's3-r11-c0': { status: 'avail', name: 'Available', section: 4, row: 'L', col: 1 },
    's3-r11-c1': { status: 'sold', name: 'Arthur Johnson', section: 4, row: 'L', col: 2 },
    's3-r12-c0': { status: 'buried', name: 'Ethel Johnson', section: 4, row: 'M', col: 1 },
    's3-r12-c1': { status: 'sold', name: 'Walter Johnson', section: 4, row: 'M', col: 2 },
    's3-r13-c0': { status: 'buried', name: 'Gladys Johnson', section: 4, row: 'N', col: 1 },
    's3-r13-c1': { status: 'sold', name: 'Harold Johnson', section: 4, row: 'N', col: 2 },
    's3-r14-c0': { status: 'buried', name: 'Beatrice Johnson', section: 4, row: 'O', col: 1 },
    's3-r14-c1': { status: 'buried', name: 'Raymond Johnson', section: 4, row: 'O', col: 2 },
    's3-r15-c0': { status: 'avail', name: 'Available', section: 4, row: 'P', col: 1 },
    's3-r15-c1': { status: 'avail', name: 'Available', section: 4, row: 'P', col: 2 },
  };
  // ── END DATA ──────────────────────────────────────────

  let currentTab = 'admin';

  function treeSVG() {
    return `<svg width="44" height="48" viewBox="0 0 44 48" xmlns="http://www.w3.org/2000/svg">
      <rect x="18" y="38" width="8" height="10" rx="2" fill="#8B6914"/>
      <polygon points="22,2 4,22 40,22" fill="#5DCAA5"/>
      <polygon points="22,12 2,34 42,34" fill="#1D9E75"/>
      <polygon points="22,22 4,42 40,42" fill="#0F6E56"/>
    </svg>`;
  }

  function buildLegend() {
    document.getElementById('legend').innerHTML = currentTab === 'admin'
      ? `<span class="leg"><span class="swatch sw-avail"></span>Available</span>
         <span class="leg"><span class="swatch sw-sold"></span>Sold</span>
         <span class="leg"><span class="swatch sw-buried"></span>Buried</span>`
      : `<span class="leg"><span class="swatch sw-avail"></span>Available</span>
         <span class="leg"><span class="swatch sw-sold"></span>Unavailable</span>
         <span class="leg"><span class="swatch sw-buried"></span>Buried</span>`;
  }

  function buildGrid() {
    const isClient = currentTab === 'client';
    const sectionsEl = document.getElementById('sections');
    sectionsEl.innerHTML = '';

    for (let s = 0; s < NUM_SECTIONS; s++) {
      if (s > 0) {
        const div = document.createElement('div');
        div.className = 'section-divider';
        sectionsEl.appendChild(div);
      }

      const block = document.createElement('div');
      block.className = 'section-block';

      const labelRow = document.createElement('div');
      labelRow.style.cssText = 'display:flex;flex-direction:column;align-items:center;margin-bottom:5px;gap:2px;';
      const isLast = s === NUM_SECTIONS - 1;
      labelRow.innerHTML = isLast
        ? `${treeSVG()}<span class="section-label" style="margin-bottom:0">Section ${s + 1}</span>`
        : `<span class="section-label" style="margin-bottom:0">Section ${s + 1}</span>`;
      block.appendChild(labelRow);

      const tbl = document.createElement('table');
      let html = '<tr><th class="col-h" style="width:20px"></th>';
      for (let c = 0; c < COLS_PER_SEC; c++) html += `<th class="col-h">${c + 1}</th>`;
      html += '</tr>';

      for (let r = 0; r < NUM_ROWS; r++) {
        const rowLabel = String.fromCharCode(65 + r);
        html += `<tr><td class="rlbl">${rowLabel}</td>`;
        for (let c = 0; c < COLS_PER_SEC; c++) {
          const key = `s${s}-r${r}-c${c}`;
          const d = data[key];
          let lbl, tipName, tipStatus;
          if (isClient) {
            if (d.status === 'avail')        { lbl = 'OPEN'; tipName = 'Available';   tipStatus = 'Available'; }
            else if (d.status === 'buried')  { lbl = initials(d.name); tipName = d.name; tipStatus = 'Buried'; }
            else                             { lbl = '';     tipName = 'Unavailable'; tipStatus = 'Unavailable'; }
          } else {
            lbl = d.status === 'avail' ? 'OPEN' : initials(d.name);
            tipName   = d.name;
            tipStatus = d.status === 'avail' ? 'Available' : d.status === 'sold' ? 'Sold' : 'Buried';
          }
          html += `<td class="cell ${d.status}" data-k="${key}">
            ${lbl}
            <div class="hover-tip">${tipName}<div class="tt-sub">S${s+1} · ${rowLabel}-${c+1} · ${tipStatus}</div></div>
          </td>`;
        }
        html += '</tr>';
      }
      tbl.innerHTML = html;
      block.appendChild(tbl);
      sectionsEl.appendChild(block);
    }
  }

  function buildStats() {
    const isClient = currentTab === 'client';
    const counts = { avail: 0, sold: 0, buried: 0 };
    Object.values(data).forEach(d => counts[d.status]++);
    const statsEl = document.getElementById('stats');
    if (isClient) {
      statsEl.innerHTML = `
        <div class="stat"><div class="stat-n" style="color:#0F6E56">${counts.avail}</div><div class="stat-l">Available</div></div>
        <div class="stat"><div class="stat-n" style="color:#854F0B">${counts.sold}</div><div class="stat-l">Unavailable</div></div>
        <div class="stat"><div class="stat-n" style="color:#5F5E5A">${counts.buried}</div><div class="stat-l">Buried</div></div>`;
    } else {
      statsEl.innerHTML = '';
      [['avail','Available','#0F6E56'],['sold','Sold','#854F0B'],['buried','Buried','#5F5E5A']].forEach(([s,l,col]) => {
        statsEl.innerHTML += `<div class="stat"><div class="stat-n" style="color:${col}">${counts[s]}</div><div class="stat-l">${l}</div></div>`;
      });
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-admin').classList.toggle('active', tab === 'admin');
    document.getElementById('tab-client').classList.toggle('active', tab === 'client');
    document.getElementById('search').value = '';
    document.getElementById('clear-btn').style.display = 'none';
    document.getElementById('no-results').style.display = 'none';
    buildLegend();
    buildGrid();
    buildStats();
  }

  // ── SEARCH ────────────────────────────────────────────
  const searchEl = document.getElementById('search');
  const clearBtn = document.getElementById('clear-btn');
  searchEl.addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    clearBtn.style.display = q ? 'block' : 'none';
    const noResults = document.getElementById('no-results');
    if (!q) {
      document.querySelectorAll('.cell').forEach(el => el.classList.remove('dimmed','highlighted'));
      noResults.style.display = 'none';
      return;
    }
    let found = 0;
    document.querySelectorAll('.cell').forEach(el => {
      const d = data[el.dataset.k];
      const plotId = `s${d.section}-${d.row}-${d.col}`.toLowerCase();
      const showName = currentTab === 'admin' || d.status === 'buried';
      const match = (showName && d.name.toLowerCase().includes(q)) || plotId.includes(q) || `section ${d.section}`.includes(q);
      if (match) { el.classList.remove('dimmed'); el.classList.add('highlighted'); found++; }
      else       { el.classList.add('dimmed');    el.classList.remove('highlighted'); }
    });
    noResults.style.display = found === 0 ? 'block' : 'none';
  });
  clearBtn.addEventListener('click', () => {
    searchEl.value = '';
    searchEl.dispatchEvent(new Event('input'));
    searchEl.focus();
  });

  switchTab('admin');
</script>

</div>
</div>
</body>
</html>
